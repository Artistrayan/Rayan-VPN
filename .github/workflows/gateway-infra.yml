name: Gateway Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "deploy/ansible/**"
      - ".github/workflows/gateway-infra.yml"
  pull_request:
    paths:
      - "deploy/ansible/**"
      - ".github/workflows/gateway-infra.yml"

permissions:
  contents: read

concurrency:
  group: gateway-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible Core
        run: python -m pip install --disable-pip-version-check ansible-core
      - name: Validate inventory
        run: ansible-inventory -i inventory/hosts.yml.example --list
      - name: Validate playbook syntax
        run: ansible-playbook -i inventory/hosts.yml.example gateway.yml --syntax-check
