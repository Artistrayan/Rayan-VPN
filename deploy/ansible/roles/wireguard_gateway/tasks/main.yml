---
- name: Install WireGuard runtime and routing tools
  ansible.builtin.apt:
    name: "{{ wireguard_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect gateway private key
  ansible.builtin.stat:
    path: "{{ wireguard_private_key_path }}"
  register: wireguard_private_key_stat

- name: Generate gateway private key locally on the gateway
  ansible.builtin.shell:
    cmd: "umask 077; wg genkey > {{ wireguard_private_key_path }}"
  when: not wireguard_private_key_stat.stat.exists or wireguard_private_key_stat.stat.size | int == 0
  no_log: true

- name: Enforce gateway private key ownership and permissions
  ansible.builtin.file:
    path: "{{ wireguard_private_key_path }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Read gateway public key without exporting its private key
  ansible.builtin.shell:
    cmd: "wg pubkey < {{ wireguard_private_key_path }}"
  register: wireguard_gateway_public_key
  changed_when: false

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-rayan-vpn-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1

- name: Apply IPv4 forwarding
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Render WireGuard configuration template without secrets
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_path }}.template"
    owner: root
    group: root
    mode: "0600"

- name: Build final WireGuard config on gateway without exporting private key
  ansible.builtin.shell:
    cmd: |
      set -eu
      key="$(cat "{{ wireguard_private_key_path }}")"
      tmp="$(mktemp /etc/wireguard/wg0.conf.XXXXXX)"
      trap 'rm -f "$tmp"' EXIT
      sed "s|^PrivateKey = __RAYAN_WG_PRIVATE_KEY__$|PrivateKey = ${key}|" "{{ wireguard_config_path }}.template" > "$tmp"
      chmod 0600 "$tmp"
      if ! cmp -s "$tmp" "{{ wireguard_config_path }}"; then
        mv "$tmp" "{{ wireguard_config_path }}"
        trap - EXIT
        printf 'wireguard-config-updated\n'
      fi
  register: wireguard_config_render
  changed_when: "'wireguard-config-updated' in wireguard_config_render.stdout"
  no_log: true
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "{{ wireguard_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
