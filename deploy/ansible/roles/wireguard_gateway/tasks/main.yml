---
- name: Install WireGuard runtime and routing tools
  ansible.builtin.apt:
    name: "{{ wireguard_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate gateway private key locally on the gateway
  ansible.builtin.shell:
    cmd: "umask 077; test -s {{ wireguard_private_key_path }} || wg genkey > {{ wireguard_private_key_path }}"
    creates: "{{ wireguard_private_key_path }}"
  no_log: true

- name: Enforce gateway private key ownership and permissions
  ansible.builtin.file:
    path: "{{ wireguard_private_key_path }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Read gateway public key
  ansible.builtin.command:
    argv:
      - wg
      - pubkey
    stdin: "{{ lookup('ansible.builtin.file', wireguard_private_key_path) }}"
  register: wireguard_gateway_public_key
  changed_when: false
  no_log: true

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-rayan-vpn-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1

- name: Apply IPv4 forwarding
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Install WireGuard interface configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: "{{ wireguard_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
